name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Five-minute performance demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Run the dependency-free performance demo
        run: ./quickstart/run_demo.sh

      - name: Upload performance table and predictions
        uses: actions/upload-artifact@v4
        with:
          name: performance-demo
          path: |
            results/performance_demo.csv
            results/performance_demo.md
            results/predictions_demo.csv
            results/roc_points_demo.csv
          if-no-files-found: error
          retention-days: 30
